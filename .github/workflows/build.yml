name: pas

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest] # 윈도우와 맥 환경에서 동시에 빌드

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pynput pygetwindow psutil pyinstaller

    - name: Build with PyInstaller (Windows/Mac)
      run: |
        pyinstaller --noconsole --onefile --icon=icon.ico --add-data "icon.ico${{ runner.os == 'Windows' && ';' || ':' }}." pas.py

    - name: Upload build results
      uses: actions/upload-artifact@v4
      with:
        name: timer-app-${{ matrix.os }}
        path: dist/
        - name: Build with PyInstaller (Windows/Mac)
      